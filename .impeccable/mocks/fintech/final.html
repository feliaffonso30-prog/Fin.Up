<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinUp: Noche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --noche:radial-gradient(135% 88% at 94% -10%,#5361e0 0%,#3740ac 30%,#171c5e 62%,#0b0e30 100%);
  --texto:#ffffff;--gris:#d3d7f2;
  --vidrio:rgba(255,255,255,.09);--filo:rgba(255,255,255,.14);
  --azul:linear-gradient(150deg,#4d5eff,#3140d6);
  --boton:#ffffff;--boton-texto:#0b0e30;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --mal-texto:#c8cdff;--mal-fondo:rgba(150,160,255,.14);--mal-filo:rgba(190,197,255,.3);
}
*{box-sizing:border-box;margin:0}
body{background:#e4e5ea;color:#15172b;font-family:"Schibsted Grotesk","Segoe UI",system-ui,Arial,sans-serif;font-size:16px;line-height:1.4;padding:0 0 56px}
.controles{position:sticky;top:0;z-index:5;background:#e4e5ea;padding:16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;box-shadow:0 10px 16px -14px rgba(21,23,43,.6)}
.controles h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.grupo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.chip{border:0;background:#fff;color:#15172b;font:inherit;font-weight:700;padding:9px 14px;border-radius:12px;cursor:pointer;transition:transform .12s var(--ease-out)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed=true]{background:#15172b;color:#fff}
.chip:focus-visible,.boton:focus-visible{outline:3px solid #7a88ff;outline-offset:2px}
.pantallas{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;padding:26px 16px 0}
figure{width:360px;max-width:100%}
figcaption{margin-top:12px;font-weight:700;font-size:15px}
figcaption span{display:block;font-weight:400;color:#4f5268;margin-top:2px}
.tel{width:100%;height:760px;border-radius:32px;overflow:hidden;background:var(--noche);color:var(--texto);display:flex;flex-direction:column;position:relative;box-shadow:0 18px 40px -22px rgba(12,16,51,.6)}
.barra{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 0}
.marca{font-weight:900;font-size:24px;letter-spacing:-.04em}
.boton{display:block;width:100%;border:0;border-radius:18px;padding:18px;background:var(--boton);color:var(--boton-texto);font:inherit;font-weight:800;font-size:18px;text-align:center;cursor:pointer;transition:transform .12s var(--ease-out)}
.boton:active{transform:scale(.97)}
.nota{font-size:13px;text-align:center;margin-top:10px;color:var(--gris)}
.pie{padding:14px 18px 22px;margin-top:auto}
.bloque-azul{background:var(--azul);box-shadow:0 14px 30px -18px rgba(6,10,50,.9)}

/* Cifras: lo bueno y lo malo con el mismo tamaño */
.cifra{border-radius:18px;padding:13px 14px;background:var(--vidrio);box-shadow:inset 0 0 0 1px var(--filo)}
.cifra small{display:block;font-size:13px;font-weight:600}
.cifra b{display:block;font-size:25px;font-weight:900;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.mal{background:var(--mal-fondo);box-shadow:inset 0 0 0 1px var(--mal-filo)}
.mal b{color:var(--mal-texto)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* 1. Entrada */
.panel{margin:16px 16px 0;border-radius:24px;padding:24px 20px 26px}
.gran{font-size:44px;line-height:.98;font-weight:900;letter-spacing:-.035em}
.sub{margin-top:14px;font-size:17px}
.vista{padding:26px 22px 0}
.vista h2{font-size:16px;font-weight:700}
.ejemplo{font-size:13px;color:var(--gris);margin-top:10px}

/* 2. Pregunta */
.avance{display:flex;gap:5px;padding:18px 22px 0}
.avance i{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.2)}
.avance i.ya{background:#fff}
.pregunta{padding:26px 22px 0;font-size:33px;line-height:1.04;font-weight:900;letter-spacing:-.03em}
.ayuda{padding:12px 22px 0;color:var(--gris);font-size:16px}
.opciones{list-style:none;padding:24px 18px 0;display:grid;gap:10px;align-content:start}
.opciones button{width:100%;text-align:left;border:0;border-radius:18px;padding:16px 18px;background:var(--vidrio);box-shadow:inset 0 0 0 1px var(--filo);font:inherit;color:inherit;cursor:pointer}
.opciones b{display:block;font-size:18px;font-weight:700}
.opciones span{display:block;font-size:14px;color:var(--gris);margin-top:1px}
.opciones .activa{background:var(--azul);box-shadow:0 12px 24px -16px rgba(6,10,50,.9)}
.opciones .activa span{color:#fff}

/* 3. Resultado */
.tu{padding:28px 22px 0;font-size:17px;font-weight:600}
.perfil{padding:2px 22px 0;font-size:50px;line-height:1;font-weight:900;letter-spacing:-.04em}
.porque{padding:14px 22px 0;font-size:16px;color:var(--gris)}
.escenarios{margin:24px 16px 0;display:grid;gap:12px}
.bloque{border-radius:24px;padding:18px}
.bloque small{display:block;font-size:14px;font-weight:600}
.bloque b{display:block;font-size:38px;line-height:1.04;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bloque p{font-size:14px;margin-top:2px}
.bloque.mal small,.bloque.mal p{color:var(--texto)}

/* 4. Mi plan */
.cuerpo{flex:1;min-height:0;overflow:hidden;padding:16px 16px 0;display:grid;gap:22px;align-content:start}
.paso{border-radius:24px;padding:18px}
.paso small{font-size:14px;font-weight:600;display:block}
.paso h2{font-size:25px;line-height:1.05;font-weight:900;letter-spacing:-.025em;margin-top:2px}
.paso p{font-size:15px;margin-top:6px}
.paso .boton{margin-top:14px;padding:13px;font-size:16px;border-radius:14px}
.seccion{padding:0 4px}
.seccion h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.reparto{display:flex;height:14px;gap:3px;margin-top:12px}
.reparto i{border-radius:5px}
.leyenda{list-style:none;padding:0;margin-top:12px;display:grid;gap:8px;font-size:15px}
.leyenda li{display:flex;align-items:center;gap:9px}
.leyenda u{width:12px;height:12px;border-radius:4px;flex:none}
.leyenda b{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.menu{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--vidrio);box-shadow:inset 0 1px 0 var(--filo);padding:10px 6px 14px;text-align:center;font-size:12px;font-weight:600;color:var(--gris)}
.menu .ya{color:#fff;font-weight:800}
.menu .bot{background:#fff;color:var(--boton-texto);font-weight:800;border-radius:999px;padding:9px 2px}

/* Revelado del resultado: una sola vez por persona */
@keyframes aparecer{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.revelado.jugando .r{animation:aparecer .5s var(--ease-out) both;animation-delay:calc(var(--i)*70ms + 120ms)}
@media (prefers-reduced-motion:reduce){
  @keyframes aparecer{from{opacity:0}to{opacity:1}}
  .chip,.boton{transition:none}
}
</style>
</head>
<body data-mal="ambar">
<div class="controles">
  <h1>FinUp, Noche</h1>
  <button class="chip" type="button" id="repetir">Repetir animación</button>
</div>
<div class="pantallas">

<figure>
  <section class="tel">
    <div class="barra"><span class="marca">finup</span><span>Ingresar</span></div>
    <div class="panel bloque-azul">
      <h2 class="gran">Antes de poner un peso, mirá qué puede pasar.</h2>
      <p class="sub">Tu plan en 3 minutos, con lo bueno y lo malo a la vista.</p>
    </div>
    <div class="vista">
      <h2>Si arrancás con USD 1.000, en dólares</h2>
      <div class="dos">
        <div class="cifra"><small>Año normal</small><b>+29 a 69</b></div>
        <div class="cifra mal"><small>Mal año</small><b>−121</b></div>
      </div>
      <p class="ejemplo">Es un ejemplo, no una promesa.</p>
    </div>
    <div class="pie"><button class="boton" type="button">Armar mi plan</button><p class="nota">Sin cuenta. No movemos tu plata.</p></div>
  </section>
  <figcaption>1. Entrada<span>Un solo bloque azul y las cifras directo sobre el fondo.</span></figcaption>
</figure>

<figure>
  <section class="tel">
    <div class="barra"><span class="marca">finup</span><span>Pregunta 3 de 7</span></div>
    <div class="avance"><i class="ya"></i><i class="ya"></i><i class="ya"></i><i></i><i></i><i></i><i></i></div>
    <h2 class="pregunta">¿Cuándo vas a necesitar esta plata?</h2>
    <p class="ayuda">Cuanto más tiempo tengas, más caídas podés esperar a que se recuperen.</p>
    <ul class="opciones">
      <li><button type="button"><b>En menos de 2 años</b><span>Un viaje, una mudanza, un estudio</span></button></li>
      <li><button type="button" class="activa"><b>Entre 2 y 5 años</b></button></li>
      <li><button type="button"><b>Entre 5 y 10 años</b></button></li>
      <li><button type="button"><b>En más de 10 años</b><span>Largo plazo, retiro</span></button></li>
    </ul>
    <div class="pie"><button class="boton" type="button">Seguir</button></div>
  </section>
  <figcaption>2. Cuestionario<span>Tarjetas translúcidas y la opción elegida en azul.</span></figcaption>
</figure>

<figure>
  <section class="tel revelado jugando" id="resultado">
    <div class="barra"><span class="marca">finup</span><span>Tu resultado</span></div>
    <p class="tu r" style="--i:0">Te salió un perfil</p>
    <h2 class="perfil r" style="--i:1">Conservador</h2>
    <p class="porque r" style="--i:2">Porque preferís cuidar tu plata antes que hacerla crecer rápido. Con USD 1.000, en un año podría pasar esto:</p>
    <div class="escenarios">
      <div class="bloque bloque-azul r" style="--i:3"><small>En un año normal</small><b>+USD 29 a 69</b><p>Estimado, según cómo venga el año</p></div>
      <div class="bloque mal r" style="--i:4"><small>En un mal año</small><b>−USD 121</b><p>Te quedarían unos USD 879</p></div>
    </div>
    <div class="pie r" style="--i:5"><button class="boton" type="button">Ver mi plan</button><p class="nota">Estimaciones, no promesas.</p></div>
  </section>
  <figcaption>3. Resultado<span>Aparece de a poco, con lo bueno y lo malo del mismo tamaño.</span></figcaption>
</figure>

<figure>
  <section class="tel">
    <div class="barra"><span class="marca">finup</span><span>Conservador</span></div>
    <div class="cuerpo">
      <div class="paso bloque-azul">
        <small>Tu próximo paso</small>
        <h2>Primero, tus deudas caras</h2>
        <p>Pagarlas te ahorra más de lo que te daría casi cualquier inversión.</p>
        <button class="boton" type="button">Ver cómo empezar</button>
      </div>
      <div class="seccion">
        <h3>En un año, con USD 1.000, en dólares</h3>
        <div class="dos">
          <div class="cifra"><small>Año normal</small><b>+29 a 69</b></div>
          <div class="cifra mal"><small>Mal año</small><b>−121</b></div>
        </div>
      </div>
      <div class="seccion">
        <h3>Cómo se reparte tu plata</h3>
        <div class="reparto"><i style="width:55%;background:#7c89ff"></i><i style="width:20%;background:#b9c0ff"></i><i style="width:15%;background:#fff"></i><i style="width:10%;background:#5b66c9"></i></div>
        <ul class="leyenda">
          <li><u style="background:#7c89ff"></u>Préstamos a gobiernos y empresas<b>55%</b></li>
          <li><u style="background:#b9c0ff"></u>Plata disponible al instante<b>20%</b></li>
        </ul>
      </div>
    </div>
    <nav class="menu"><span class="ya">Mi plan</span><span>Tus pesos</span><span class="bot">FinBot</span><span>Ejemplos</span><span>Aprender</span></nav>
  </section>
  <figcaption>4. Mi plan<span>Menos cajas: los datos van sobre el fondo, y FinBot queda como detalle blanco.</span></figcaption>
</figure>

</div>
<script>
const res=document.getElementById('resultado');
document.getElementById('repetir').addEventListener('click',()=>{res.classList.remove('jugando');void res.offsetWidth;res.classList.add('jugando');});
</script>
</body>
</html>
