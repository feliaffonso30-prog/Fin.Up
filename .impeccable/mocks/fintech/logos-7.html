<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinUp: logos, séptima ronda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--noche:radial-gradient(135% 88% at 94% -10%,#5361e0 0%,#3740ac 30%,#171c5e 62%,#0b0e30 100%);--gris:#d3d7f2;--curva:cubic-bezier(0.23,1,0.32,1)}
*{box-sizing:border-box;margin:0}
body{background:#e4e5ea;color:#15172b;font-family:"Schibsted Grotesk","Segoe UI",system-ui,Arial,sans-serif;font-size:16px;line-height:1.4;padding:0 16px 64px}
.ancho{max-width:1120px;margin:0 auto}
.cabeza{position:sticky;top:0;z-index:5;background:#e4e5ea;padding:20px 0 12px;box-shadow:0 10px 14px -14px rgba(21,23,43,.6)}
h1{font-size:30px;line-height:1.08;font-weight:900;letter-spacing:-.03em}
.bajada{margin-top:6px;font-size:16px;color:#3f4259;max-width:74ch}
.controles{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:12px}
.modo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modo>span{font-size:14px;font-weight:700;color:#3f4259}
.chip{border:0;background:#fff;color:#15172b;font:inherit;font-weight:700;min-height:44px;padding:8px 16px;border-radius:12px;cursor:pointer;transition:transform .12s var(--curva)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed=true]{background:#15172b;color:#fff}
.chip:focus-visible{outline:3px solid #5361e0;outline-offset:2px}
.familia{margin-top:34px;font-size:15px;font-weight:800;color:#3f4259}
.nota-familia{margin-top:2px;font-size:14px;color:#3f4259;max-width:80ch}
.opcion{margin-top:14px}
.opcion h2{font-size:26px;font-weight:900;letter-spacing:-.025em}
.opcion>p{margin-top:3px;color:#3f4259;max-width:72ch}
.lamina{margin-top:12px;border-radius:24px;overflow:hidden;background:#0b0e30;background-image:var(--noche);color:#fff;display:grid;grid-template-columns:1.25fr 1fr}
.hero{padding:30px 28px;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:220px}
.estado{font-size:15px;color:var(--gris)}
.lado{padding:22px 24px;display:flex;flex-direction:column;gap:18px;justify-content:center;background:rgba(11,14,48,.55)}
.sello{display:flex;align-items:center;gap:.22em;font-weight:900;letter-spacing:-.04em;line-height:1}
.atras .sello{flex-direction:row-reverse}
.hero .sello{align-self:flex-start}
.sello svg{display:block;flex:none;overflow:visible}
.tamanos{display:flex;align-items:flex-end;gap:16px}
.tamanos figure{margin:0;text-align:center}
.tamanos figcaption{font-size:12px;color:var(--gris);margin-top:5px}
.icono{display:block;border-radius:22%}
.barra-app{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font-size:14px}
.apps{display:flex;gap:12px;align-items:flex-end}
.apps i{display:block;width:44px;height:44px;border-radius:22%}
.apps span{display:block;text-align:center;font-size:11px;color:#fff;margin-top:3px}
.apps div{width:48px}
.lectura{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;margin-top:10px;font-size:15px;color:#3f4259}
.lectura b{color:#15172b}

/* ---- Movimiento: solo transform y opacity ---- */
.vivo *{transform-box:view-box}
.vivo{overflow:visible}

/* Movimiento (criterios de Emil Kowalski):
   - Bucle de carga: CSS (corre fuera del hilo principal), solo transform y opacity.
     Giro constante = linear; vaivén en pantalla = ease-in-out fuerte.
   - Resultado: WAAPI. Arranca desde la posición actual (sin saltos) y llega con ease-out fuerte, sin rebote.
   - Tono firme: nada de overshoot. Una sola entrada por símbolo. */
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
.vivo *{transform-box:view-box}

/* Bucles de carga: solo transform y opacity. Giro constante = linear; vaivén = ease-in-out fuerte. Sin rebote. */
.m-t1,.m-t2,.m-t3,.m-esp{transform-origin:32px 32px}
.m-portal{transform-origin:32px 56px}
.cargando .m-t1{animation:giro 14s linear infinite}
.cargando .m-t2{animation:giro-inv 10s linear infinite}
.cargando .m-t3{animation:giro 7s linear infinite}
.cargando .m-esp{animation:giro 12s linear infinite}
.cargando .m-c1{animation:ola 2.4s var(--ease-in-out) infinite alternate}
.cargando .m-c2{animation:ola 2.4s var(--ease-in-out) .35s infinite alternate}
.cargando .m-c3{animation:ola 2.4s var(--ease-in-out) .7s infinite alternate}
.cargando .m-clave{animation:clave 2s var(--ease-in-out) infinite alternate}
.cargando .m-portal{animation:portal 2s var(--ease-in-out) infinite alternate}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes giro-inv{to{transform:rotate(-360deg)}}
@keyframes ola{from{opacity:.4}to{opacity:1}}
@keyframes clave{from{transform:translateY(-3.5px)}to{transform:translateY(0)}}
@keyframes portal{from{transform:scaleY(.82)}to{transform:scaleY(1)}}

@media (prefers-reduced-motion:reduce){.vivo *{animation:none!important}.cargando [class*=m-c]{animation:ola 2.4s ease-in-out infinite alternate!important}.chip{transition:none}}
@media (max-width:760px){.lamina{grid-template-columns:1fr}.hero{min-height:170px;padding:24px 20px}.lectura{grid-template-columns:1fr}.hero .sello{font-size:54px!important}}
</style>
</head>
<body>
<div class="ancho">
  <div class="cabeza">
    <h1>Logos, séptima ronda: tiempo y solidez</h1>
    <p class="bajada">Ya no buscamos «plata»: buscamos el significado primero. Tus dos prioridades: tiempo y constancia (tres bocetos) y solidez (dos). Se mueven mientras la app carga y hacen un gesto al mostrar tu resultado.</p>
    <div class="controles">
      <div class="modo" role="group" aria-label="Estado"><span>Estado</span>
        <button class="chip" type="button" data-modo="cargando" aria-pressed="true">Cargando</button>
        <button class="chip" type="button" data-modo="revelar" aria-pressed="false">Mostrar el resultado</button>
      </div>
      <div class="modo" role="group" aria-label="Posición del símbolo"><span>Símbolo</span>
        <button class="chip" type="button" data-pos="adelante" aria-pressed="true">Adelante del nombre</button>
        <button class="chip" type="button" data-pos="atras" aria-pressed="false">Atrás del nombre</button>
      </div>
    </div>
  </div>
  <div id="opciones"></div>
</div>
<script>
const LAV = "#8d99ff", LAV2 = "#d3d7ff";

// T1. Anillos abiertos: capas de un tronco, con el hueco abajo. Cada anillo gira a su ritmo; al terminar, los huecos se alinean.
const anillo = (r, sw, col, cls, abierto = 0.2) => {
  const c = 2 * Math.PI * r, rot = 90 - 360 * (1 - abierto / 2);
  return `<g class="${cls}"><circle cx="32" cy="32" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(c * (1 - abierto)).toFixed(2)} ${(c * abierto).toFixed(2)}" transform="rotate(${rot} 32 32)"/></g>`;
};
const anillos = (chico) => chico
  ? anillo(24, 8, "#fff", "m-t1", 0.2) + anillo(10.5, 8, LAV, "m-t2", 0.3)
  : anillo(27, 5, "#fff", "m-t1", 0.18) + anillo(17.5, 5, LAV2, "m-t2", 0.22) + anillo(8.5, 5, LAV, "m-t3", 0.28);

// T2. Capas: círculos que se suman hacia afuera; cada capa un poco más gruesa. Mientras carga se encienden una tras otra.
const capas = (chico) => chico
  ? `<circle class="m-c1" cx="32" cy="32" r="8" fill="#fff"/><circle class="m-c2" cx="32" cy="32" r="19" fill="none" stroke="${LAV}" stroke-width="7"/>`
  : `<circle class="m-c1" cx="32" cy="32" r="7" fill="#fff"/><circle class="m-c2" cx="32" cy="32" r="17" fill="none" stroke="${LAV}" stroke-width="4"/><circle class="m-c3" cx="32" cy="32" r="27" fill="none" stroke="#fff" stroke-width="6"/>`;

// T3. Espiral: una sola línea que crece sobre sí misma, como el interés compuesto o los años de un árbol.
const espiral = (chico) => chico
  ? `<g class="m-esp"><path d="M32 32a4 4 0 0 1 8 0a8 8 0 0 1-16 0a12 12 0 0 1 24 0a16 16 0 0 1-32 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g>`
  : `<g class="m-esp"><path d="M32 32a3 3 0 0 1 6 0a6 6 0 0 1-12 0a9 9 0 0 1 18 0a12 12 0 0 1-24 0a15 15 0 0 1 30 0a18 18 0 0 1-36 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>`;

// S1. Arco con piedra clave: la pieza que sostiene a las demás. Mientras carga la clave sube y baja; al terminar queda encajada.
const arco = (chico) => chico
  ? `<path d="M14 56V34a18 18 0 0 1 36 0V56" fill="none" stroke="#fff" stroke-width="11"/><polygon class="m-clave" points="26,7 38,7 41,23 23,23" fill="${LAV}"/>`
  : `<path d="M15 56V33a17 17 0 0 1 34 0V56" fill="none" stroke="#fff" stroke-width="7"/><polygon class="m-clave" points="27.5,8 36.5,8 39,21 25,21" fill="${LAV}"/>`;

// S2. Portal: un arco macizo con un arco de luz adentro. Mientras carga la luz crece desde el piso; al terminar queda llena.
const portal = (chico) => chico
  ? `<path d="M11 56V30a21 21 0 0 1 42 0V56Z" fill="#fff"/><g class="m-portal"><path d="M23 56V31a9 9 0 0 1 18 0V56Z" fill="${LAV}"/></g>`
  : `<path d="M11 56V30a21 21 0 0 1 42 0V56Z" fill="#fff"/><g class="m-portal"><path d="M22 56V31a10 10 0 0 1 20 0V56Z" fill="${LAV}"/></g>`;

const OPCIONES = [
  { familia: "Tiempo y constancia", nota: "Tu primera elección. La idea: lo que vale se construye en capas, con paciencia. Sin dinero a la vista, sin flechas, sin promesa de ganancia. Tres maneras de dibujar lo mismo." },
  { id: "anillos", nombre: "Anillos abiertos", dibujo: anillos,
    idea: "Anillos como los de un tronco, con un hueco abajo en cada uno. Mientras carga cada anillo gira a su ritmo; al mostrar tu resultado los huecos se alinean y todo queda quieto.",
    dice: "Capas que se suman con el tiempo: constancia, paso a paso.",
    riesgo: "Puede leerse como diana, un ícono de carga o un logo de «ciclo». En chico quedan dos anillos." },
  { id: "capas", nombre: "Capas", dibujo: capas,
    idea: "Un centro y dos círculos alrededor, cada capa un poco más gruesa. Mientras carga se encienden una tras otra hacia afuera; al mostrar tu resultado quedan todas encendidas.",
    dice: "Un núcleo firme y lo que se va sumando alrededor.",
    riesgo: "Es la más simple y puede parecer genérica o una diana. Se diferencia solo por la proporción y los colores." },
  { id: "espiral", nombre: "Espiral", dibujo: espiral,
    idea: "Una sola línea que crece sobre sí misma, como el interés compuesto o los años de un árbol. Mientras carga gira despacio; al mostrar tu resultado queda quieta.",
    dice: "Crecimiento que se acumula, sin dar saltos.",
    riesgo: "Una espiral puede leerse como hipnosis, caracol o mareo. Está muy vista en logos de bienestar." },
  { familia: "Solidez", nota: "Tu segunda elección. La idea: la pieza que sostiene. Seguridad firme sin escudo, caja fuerte ni candado." },
  { id: "arco", nombre: "Arco con piedra clave", dibujo: arco,
    idea: "Un arco de línea gruesa con su piedra clave en lavanda, la pieza que sostiene a las demás. Mientras carga la clave sube y baja un poco; al mostrar tu resultado queda encajada.",
    dice: "Todo se apoya en una pieza que encaja: seguridad que se entiende.",
    riesgo: "Puede leerse como puerta, túnel o ícono de arquitectura o museo. La clave tiene que notarse para que no sea solo una U al revés." },
  { id: "portal", nombre: "Portal", dibujo: portal,
    idea: "Un arco macizo con un arco de luz adentro. Mientras carga la luz crece desde el piso; al mostrar tu resultado queda llena.",
    dice: "Entrar, entender: una puerta abierta, firme y clara.",
    riesgo: "Puede leerse como puerta o ícono de «inicio». Es la más pesada y la menos fina de las cinco." },
];

const svg = (o, t, vivo) => `<svg ${vivo ? 'class="vivo js-vivo cargando"' : ""} width="${t}" height="${t}" viewBox="0 0 64 64" aria-hidden="true">${o.dibujo(false, vivo)}</svg>`;
const icono = (o, t) => `<svg class="icono" width="${t}" height="${t}" viewBox="0 0 64 64" role="img" aria-label="Ícono"><rect width="64" height="64" fill="#171c5e"/><g transform="translate(8 8) scale(.75)">${o.dibujo(t <= 20, false)}</g></svg>`;
const sello = (o, fs, vivo) => `<span class="sello" style="font-size:${fs}px" role="img" aria-label="finup">${svg(o, Math.round(fs * 1.12), vivo)}<span>finup</span></span>`;

document.getElementById("opciones").innerHTML = OPCIONES.map((o) => o.familia ? `<h2 class="familia">${o.familia}</h2><p class="nota-familia">${o.nota}</p>` : `
  <section class="opcion">
    <h2>${o.nombre}</h2>
    <p>${o.idea}</p>
    <div class="lamina">
      <div class="hero">${sello(o, 76, true)}<p class="estado js-estado">Armando tu plan…</p></div>
      <div class="lado">
        <div class="tamanos">
          <figure>${icono(o, 64)}<figcaption>Ícono</figcaption></figure>
          <figure>${icono(o, 32)}<figcaption>32 px</figcaption></figure>
          <figure>${icono(o, 16)}<figcaption>Pestaña</figcaption></figure>
        </div>
        <div class="barra-app">${sello(o, 22, false)}<span>Ingresar</span></div>
        <div class="apps">
          <div><i style="background:#e9e4d8"></i><span>Notas</span></div>
          <div>${icono(o, 44)}<span>FinUp</span></div>
          <div><i style="background:#2f6d4f"></i><span>Mapas</span></div>
          <div><i style="background:#b8452f"></i><span>Música</span></div>
        </div>
      </div>
    </div>
    <div class="lectura"><p><b>Qué dice:</b> ${o.dice}</p><p><b>Riesgo:</b> ${o.riesgo}</p></div>
  </section>`).join("");

// Resultado: cada pieza que se estaba moviendo congela su posición actual y llega al reposo con ease-out fuerte.
// Así el gesto sirve aunque el resultado llegue a mitad de un ciclo (interrumpible, sin saltos).
const EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
const reducir = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function revelar(svg) {
  svg.querySelectorAll("*").forEach((el) => {
    const cs = getComputedStyle(el), actual = cs.transform, op = cs.opacity;
    el.getAnimations().forEach((a) => a.cancel());
    if (reducir()) return;
    if (op !== "1" && el.getAnimations().length === 0 && /m-c/.test(el.getAttribute("class") || "")) {
      el.animate([{ opacity: op }, { opacity: 1 }], { duration: 480, easing: EASE_OUT, fill: "backwards" });
      return;
    }
    if (!actual || actual === "none") return;
    // WAAPI: de la posición congelada al reposo. Las piezas de acento llegan un poco después (30-40 ms).
    const demora = el.dataset.llega ? Number(el.dataset.llega) : 0;
    el.animate([{ transform: actual }, { transform: "none" }], { duration: 480, delay: demora, easing: EASE_OUT, fill: "backwards" });
  });
}
const botones = [...document.querySelectorAll("[data-modo]")];
botones.forEach((b) => b.addEventListener("click", () => {
  botones.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  const modo = b.dataset.modo;
  document.querySelectorAll(".js-vivo").forEach((n) => {
    if (modo === "cargando") { n.getAnimations({ subtree: true }).forEach((a) => a.cancel()); n.classList.remove("revelar"); n.classList.add("cargando"); }
    else if (n.classList.contains("cargando")) { revelar(n); n.classList.remove("cargando"); n.classList.add("revelar"); }
  });
  document.querySelectorAll(".js-estado").forEach((p) => (p.textContent = modo === "cargando" ? "Armando tu plan…" : "Tu resultado está listo."));
}));
const pos = [...document.querySelectorAll("[data-pos]")];
pos.forEach((b) => b.addEventListener("click", () => {
  pos.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  document.body.classList.toggle("atras", b.dataset.pos === "atras");
}));
</script>
</body>
</html>
